name: release

# Manually triggered. Pass the version to cut (e.g. 0.1.0); the workflow builds
# the extension for each target, packages the PHP library + the guest wasm
# fixtures (platform-independent), and publishes a (draft) GitHub Release with
# the artifacts attached and auto-generated notes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 (no leading v)'
        required: true
        type: string
      draft:
        description: 'Publish as a draft (review before going live)'
        type: boolean
        default: true

permissions:
  contents: write # create the release

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Generic Linux — for self-hosted PHP / Docker on a modern distro.
  # Built on Ubuntu 22.04 (glibc 2.35); ships the raw .so.
  # ──────────────────────────────────────────────────────────────────────
  linux:
    name: linux ${{ matrix.arch }} · php ${{ matrix.php }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.4', arch: x86_64,  runner: ubuntu-22.04 }
          - { php: '8.4', arch: aarch64, runner: ubuntu-22.04-arm }
          - { php: '8.5', arch: x86_64,  runner: ubuntu-22.04 }
          - { php: '8.5', arch: aarch64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
        env:
          phpts: nts
      - uses: dtolnay/rust-toolchain@1.96
      # ubuntu-22.04 (kept for glibc 2.35 portability) defaults to clang 14,
      # whose emmintrin.h trips a bindgen SSE2 intrinsics bug when parsing the
      # PHP headers on x86_64. clang 15+ fixes it; aarch64 never hits it.
      - run: sudo apt-get update && sudo apt-get install -y clang-15 libclang-15-dev
      - name: Build
        run: |
          # The clang-14 emmintrin.h SSE2 bug is triggered by the *resource
          # directory* (the compiler's builtin headers), not by which libclang
          # loads — so pointing LIBCLANG_PATH at v15 isn't enough; bindgen still
          # picks up clang-14's headers. Force clang-15's resource dir via
          # bindgen's extra-args env, which pins emmintrin.h to the fixed copy.
          dir="$(dirname "$(find /usr/lib /usr/lib64 -name 'libclang-15.so*' -print -quit 2>/dev/null)")"
          [ -n "$dir" ] && [ "$dir" != "." ] || { echo "::error::libclang-15 not found"; exit 1; }
          export LIBCLANG_PATH="$dir"
          export BINDGEN_EXTRA_CLANG_ARGS="-resource-dir=$(clang-15 -print-resource-dir)"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          echo "BINDGEN_EXTRA_CLANG_ARGS=$BINDGEN_EXTRA_CLANG_ARGS"
          cargo build --release
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/release/libterrarium.so \
            "dist/terrarium-v${{ inputs.version }}-php${{ matrix.php }}-linux-${{ matrix.arch }}.so"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.php }}-${{ matrix.arch }}
          path: dist/*

  # ──────────────────────────────────────────────────────────────────────
  # AWS Lambda / Bref — built INSIDE the Bref Amazon Linux 2023 image so the
  # binary loads on Lambda (glibc 2.34). Packaged as a Bref Lambda layer zip
  # (extension + a conf.d ini) and also shipped as the raw .so.
  # ──────────────────────────────────────────────────────────────────────
  lambda-bref:
    name: lambda/bref ${{ matrix.arch }} · php ${{ matrix.php }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Bref publishes separate per-arch build images: bref/build-php-XX
        # (x86_64) and bref/arm-build-php-XX (arm64).
        include:
          - { php: '8.4', arch: x86_64, runner: ubuntu-22.04,     image: bref/build-php-84 }
          - { php: '8.4', arch: arm64,  runner: ubuntu-22.04-arm, image: bref/arm-build-php-84 }
          - { php: '8.5', arch: x86_64, runner: ubuntu-22.04,     image: bref/build-php-85 }
          - { php: '8.5', arch: arm64,  runner: ubuntu-22.04-arm, image: bref/arm-build-php-85 }
    steps:
      - uses: actions/checkout@v4

      # Build in the Bref build image via `docker run` (rather than a job
      # `container:`) so checkout/runner tooling stays on the host. The arm64
      # runner pulls the arm64 Bref image and builds an arm64 binary natively.
      - name: Build in Bref image (${{ matrix.image }})
        # The Bref build images export LD_LIBRARY_PATH/LD_PRELOAD pointing at
        # their custom-compiled libs in /opt; dnf (a Python program) segfaults
        # when its system modules pick those up. Strip those vars for the dnf
        # call only — php-config and cargo still need them afterwards.
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -v "$PWD":/src --entrypoint /bin/bash \
            "${{ matrix.image }}" -lc '
              set -euo pipefail
              env -u LD_LIBRARY_PATH -u LD_PRELOAD dnf install -y clang clang-devel
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain none
              export PATH="$HOME/.cargo/bin:/opt/bin:$PATH"
              export CARGO_TARGET_DIR=/tmp/target
              export LIBCLANG_PATH=/usr/lib64
              # ext-php-rs locates PHP by shelling out to `which`, which the
              # minimal AL2023 image does not ship; point it at Bref'\''s PHP
              # directly so detection does not depend on `which`.
              export PHP=/opt/bin/php PHP_CONFIG=/opt/bin/php-config
              cd /src
              cargo build --release          # rust-toolchain.toml pins the version
              mkdir -p dist
              cp /tmp/target/release/libterrarium.so dist/terrarium.so
              echo "built against: $(php-config --version), glibc reqs:"
              objdump -T dist/terrarium.so | grep -oE "GLIBC_[0-9.]+" | sort -V | uniq | tail -3
            '

      # The TypeScript guest (the heavy one: 1-2 s of compilation per cold
      # start), precompiled by THIS .so inside the same image, so the artifact
      # is bound to the exact build it ships with (Wasmtime version, target,
      # config). Portable by default: precompile() targets the architecture's
      # baseline CPU, not the runner's, so the artifact loads on any Lambda
      # host of that arch. Compiled without fuel metering (which is compiled
      # in), so it is for Runtimes constructed without `fuel:`; a `fuel:`
      # deployment, or any other guest, precompiles its own with
      # tools/precompile-guests.php (docs/install.md). The script also loads
      # the artifact back before writing it.
      - name: Precompile guests in Bref image (${{ matrix.image }})
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -v "$PWD":/src --entrypoint /bin/bash \
            "${{ matrix.image }}" -lc '
              set -euo pipefail
              cd /src
              # The script refuses to run if the extension did not load.
              php="/opt/bin/php -d extension=/src/dist/terrarium.so"
              $php tools/precompile-guests.php dist/precompiled tests/wasm/typescript_guest.wasm
            '

      - name: Package Bref Lambda layer
        run: |
          ver="${{ inputs.version }}"; php="${{ matrix.php }}"; arch="${{ matrix.arch }}"
          # Idiomatic Bref layout (matches brefphp/extra-php-extensions): the
          # layer mounts at /opt, Bref's extension_dir is /opt/bref/extensions,
          # and it scans /opt/bref/etc/php/conf.d for *.ini. So the .so drops in
          # by bare name and the ini just says `extension=terrarium.so` — the
          # same binary + ini then work identically in a Docker `FROM bref/php-*`.
          mkdir -p layer/bref/extensions layer/bref/etc/php/conf.d
          cp dist/terrarium.so layer/bref/extensions/terrarium.so
          echo 'extension=terrarium.so' > layer/bref/etc/php/conf.d/ext-terrarium.ini
          ( cd layer && zip -qr "../terrarium-v${ver}-php${php}-lambda-bref-${arch}.zip" . )
          cp dist/terrarium.so "terrarium-v${ver}-php${php}-lambda-bref-${arch}.so"

          # The precompiled guest, in a zip naming the .so it belongs to so a
          # mismatched pair is obvious before Wasmtime refuses it.
          so_sha="$(sha256sum dist/terrarium.so | cut -d' ' -f1)"
          printf '%s\n' \
            "# Precompiled TypeScript guest for terrarium-v${ver}-php${php}-lambda-bref-${arch}.so" \
            "" \
            "Native machine code emitted by that exact extension build (sha256 ${so_sha})," \
            "compiled for the ${arch} baseline CPU, without fuel metering. Load with" \
            "new Terrarium\\Terrarium('/var/task/typescript_guest.cwasm', precompiled: true)" \
            "on a Runtime constructed without fuel:. It loads only with that .so; any" \
            "other build refuses it. Verify against SHA256SUMS. An artifact is trusted" \
            "like the .so itself: never load one from an untrusted source. See" \
            "docs/install.md." \
            > dist/precompiled/README.md
          cp LICENSE THIRD_PARTY_LICENSES.md dist/precompiled/
          cp -R guests/typescript/third-party dist/precompiled/third-party
          ( cd dist/precompiled && zip -qr "$GITHUB_WORKSPACE/terrarium-v${ver}-php${php}-lambda-bref-${arch}-precompiled-guests.zip" . )
          ls -lh terrarium-*.zip

      - name: Assert the precompiled archive carries its licenses
        run: |
          ver="${{ inputs.version }}"; php="${{ matrix.php }}"; arch="${{ matrix.arch }}"
          listing="$(unzip -Z1 "terrarium-v${ver}-php${php}-lambda-bref-${arch}-precompiled-guests.zip")"
          for entry in \
            LICENSE \
            THIRD_PARTY_LICENSES.md \
            third-party/README.md \
            third-party/typescript/LICENSE.txt \
            third-party/typescript/ThirdPartyNoticeText.txt \
            third-party/ts-blank-space/LICENSE \
            typescript_guest.cwasm
          do
            grep -qxF "$entry" <<<"$listing" \
              || { echo "::error::precompiled guests archive is missing $entry"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-bref-${{ matrix.php }}-${{ matrix.arch }}
          path: |
            terrarium-*.zip
            terrarium-*lambda-bref*.so

  # ──────────────────────────────────────────────────────────────────────
  # macOS (Apple Silicon) — for local development (not deployable to Lambda).
  # Intel (x86_64) is intentionally omitted: the macos-13 runners are scarce
  # and Apple Silicon is the standard dev target now.
  # ──────────────────────────────────────────────────────────────────────
  macos:
    name: macos ${{ matrix.arch }} · php ${{ matrix.php }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.4', arch: arm64, runner: macos-14 }
          - { php: '8.5', arch: arm64, runner: macos-14 }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: dtolnay/rust-toolchain@1.96
      - run: cargo build --release
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/release/libterrarium.dylib \
            "dist/terrarium-v${{ inputs.version }}-php${{ matrix.php }}-macos-${{ matrix.arch }}.dylib"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.php }}-${{ matrix.arch }}
          path: dist/*

  # ──────────────────────────────────────────────────────────────────────
  # The PHP library + the guest engines — platform-independent, and required
  # at runtime: the facade (lib/*.php) is the public API and the committed
  # *_guest.wasm fixtures are the curated engines the extension loads.
  #
  # LICENSING. The guest fixtures are COMPILED FROM third-party engines —
  # QuickJS-ng (MIT), the TypeScript compiler and ts-blank-space (Apache-2.0),
  # php-src, Boa, RustPython — so this archive redistributes all of them. MIT
  # requires the license text to travel with the binary; Apache-2.0 §4 requires
  # the license and, where the upstream ships one, its NOTICE. An archive of
  # bare .wasm files satisfied neither. It now carries:
  #
  #   LICENSE                       Terrarium's own (MIT)
  #   THIRD_PARTY_LICENSES.md       every engine's notice and full license text
  #   third-party/typescript/…      TypeScript's LICENSE.txt and
  #                                 ThirdPartyNoticeText.txt, verbatim from the
  #                                 pinned npm package (refreshed by build.sh)
  #   third-party/ts-blank-space/…  likewise
  #
  # The assertion step is not decoration: shipping a license-less archive is the
  # exact failure being fixed, so a missing file fails the job instead of
  # quietly publishing.
  # ──────────────────────────────────────────────────────────────────────
  lib-and-guests:
    name: php library + guest wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          ver="${{ inputs.version }}"
          ( cd lib && zip -qr "../terrarium-v${ver}-php-lib.zip" . )
          zip -qj "terrarium-v${ver}-php-lib.zip" LICENSE

          staging="$(mktemp -d)"
          cp tests/wasm/*.wasm "$staging/"
          cp LICENSE THIRD_PARTY_LICENSES.md "$staging/"
          cp -R guests/typescript/third-party "$staging/third-party"
          ( cd "$staging" && zip -qr "$GITHUB_WORKSPACE/terrarium-v${ver}-guests.zip" . )
          ls -lh terrarium-*.zip

      - name: Assert the archives carry their licenses
        run: |
          ver="${{ inputs.version }}"
          fail=0
          listing="$(unzip -Z1 "terrarium-v${ver}-guests.zip")"
          for entry in \
            LICENSE \
            THIRD_PARTY_LICENSES.md \
            third-party/README.md \
            third-party/typescript/LICENSE.txt \
            third-party/typescript/ThirdPartyNoticeText.txt \
            third-party/ts-blank-space/LICENSE \
            typescript_guest.wasm \
            quickjs_guest.wasm
          do
            grep -qxF "$entry" <<<"$listing" \
              || { echo "::error::guests archive is missing $entry"; fail=1; }
          done
          unzip -Z1 "terrarium-v${ver}-php-lib.zip" | grep -qxF 'LICENSE' \
            || { echo "::error::php-lib archive is missing LICENSE"; fail=1; }
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: lib-and-guests
          path: terrarium-*.zip

  # ──────────────────────────────────────────────────────────────────────
  # Collect every artifact and publish the release.
  # ──────────────────────────────────────────────────────────────────────
  release:
    name: publish release
    needs: [linux, lambda-bref, macos, lib-and-guests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -lh artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          files: artifacts/*
